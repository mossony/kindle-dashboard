global
    maxconn 64

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m

frontend telemetry_ingress
    bind :4443
    maxconn 48
    stick-table type ip size 10k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 8 }
    tcp-request connection reject if { sc_conn_rate(0) gt 24 }
    default_backend tesla_receiver

backend tesla_receiver
    server receiver receiver:8443
